[package]
name = "crudo-tui"
version = "0.1.0"
edition = "2021"

[dependencies]
ratatui = "0.26"
crossterm = { version = "0.27", features = ["event-stream"] }
tokio = { version = "1.37", features = ["full"] }
anyhow = "1.0"
tracing = "0.1"
tracing-subscriber = "0.3"
unicode-width = "0.2.2"
api = { path = "../rust/crates/api" }
runtime = { path = "../rust/crates/runtime" }
tools = { path = "../rust/crates/tools" }
serde_json = "1.0"
